[package]
name = "optics-studio"
version = "0.1.0"
edition = "2024"
description = "Web UI (dioxus) over the headless optics APIs — PSF/metrics viewport"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
optics-core = { path = "../.." }
thiserror = "2"

# ADR-10.0: the framework tree lives entirely in this crate and only for the
# wasm target, so native `cargo test -p optics-studio` builds and runs the
# pure view-model without pulling dioxus (docs/adr-10.0-ui-framework.md).
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "=0.7.10", features = ["web"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "CssStyleDeclaration",
] }
